<!DOCTYPE html>

<html>

<head>
   <title>Darlene Laguna Art - Contact</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <link href="styles.css" rel="stylesheet" type="text/css">
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
   <script language="JavaScript" src=scripts.js></script>
</head>

<body class="body" onload="adjust_contact_email_message_width();" oncontextmenu="return false;">


<script>

   var email_subject      = "Subject:&nbsp;&nbsp;";
   var html_file_name     = "";
   var html_path_segments = "";
   var image_file_name    = "";
   var image_title        = "";
   var URL_parameters     = new URLSearchParams(window.location.search);


   image_file_name    = URL_parameters.get("image_file_name");
   image_title        = URL_parameters.get("image_title");
   html_path_segments = window.location.pathname.split('/');
   html_file_name     = html_path_segments[html_path_segments.length - 1];

   if (image_file_name == null)
   {
      alert("Error:\n\nImage File Name not passed to " + html_file_name);

      if (history.length > 1)
      {
         history.back();
      }
      else
      {
         window.close();
      }
   }

   if (image_title == null)
   {
      alert("Error:\n\nImage Title not passed to " + html_file_name);

      if (history.length > 1)
      {
         history.back();
      }
      else
      {
         window.close();
      }
   }

   if (image_title == "")
   {
      email_subject += "Darlene Laguna Art";
   }
   else
   {
      email_subject += image_title;
   }

   write_header();

   document.getElementById("contact_link").className = "clicked_header_link";

   document.writeln('<div id="contact_header" class="header_link" style="text-align: center; margin-bottom: 15px; display: none">Contact</div>');

   document.writeln('<div class="contact_container">');
   document.writeln('');
   document.writeln('   <div class="contact_image_container">');
   document.writeln('      <div style="display: inline-block; position: relative">');
   document.writeln('         <img id="contact_image" class="contact_image border_radius" src="'+image_file_name+'">');
   document.writeln('         <button id="nav_left"  class="nav_button" style="position: absolute; height: 36px; width: 14px; left:  0px" onclick="update_contact_image(\''+image_file_name+'\',\'left\'); "><div class="nav_left_shape"  style="transform: scale(90%)"></div></button>');
   document.writeln('         <button id="nav_right" class="nav_button" style="position: absolute; height: 36px; width: 14px; right: 0px" onclick="update_contact_image(\''+image_file_name+'\',\'right\');"><div class="nav_right_shape" style="transform: scale(90%)"></div></button>');
   document.writeln('      </div>');
   document.writeln('   </div>');
   document.writeln('');
   document.writeln('   <div class="contact_email_container">');
   document.writeln('      <span id="contact_email_subject" class="contact_email_subject">'+email_subject+'</span>');
   document.writeln('      <textarea id="contact_email_message" class="contact_email_message" placeholder="Type your message here..."></textarea>');
   document.writeln('      <br>');
   document.writeln('      <span class="email_send_button" onClick="send_email()">Send email</span>');
   document.writeln('   </div>');
   document.writeln('');
   document.writeln('</div>');

   write_footer();

   // Perform a hard reload when the device window orientation changes.

   window.addEventListener("orientationchange", function() {location.href = self.location.href;});

   // Connect keyboard keys to navigation buttons.

   document.addEventListener("keydown",(event) => {if (event.key == "ArrowLeft")  document.getElementById("nav_left" ).click();});
   document.addEventListener("keydown",(event) => {if (event.key == "ArrowRight") document.getElementById("nav_right").click();});

</script>

<script>

function adjust_contact_email_message_width()
{
   var scale = 0;


   // If running on an iPad in portrait mnode, set contact_email_message width equal to contact_image width.

   if ( (navigator.platform.toLowerCase().indexOf("ipad") != -1) || ((navigator.platform.toLowerCase().indexOf("macintel") != -1) && (navigator.maxTouchPoints > 1)) )
   {
      // We're running on an iPad.

      if (window.innerHeight >= window.innerWidth)
      {
         var contact_image = null;
         var new_width     = 0;
         var scale         = 0;


         // We're in portrait mode.

         contact_image = document.querySelector("#contact_image");
         scale         = contact_image.height / contact_image.naturalHeight;
         new_width     = scale * contact_image.naturalWidth;

         document.getElementById("contact_email_subject").style.minWidth = "425px";
         document.getElementById("contact_email_subject").style.width = new_width + "px";

         document.getElementById("contact_email_message").style.minWidth = "425px";
         document.getElementById("contact_email_message").style.width = new_width + "px";
      }
   }
}

function send_email()
{
   var email         = "mailto:";
   var email_address = "dkclaguna@gmail.com";
   var email_subject = "?subject=Darlene Laguna Art";
   var email_text    = "&body=";


   if (image_title != "") email_subject += " - " + image_title;

   email_text += document.getElementById("contact_email_message").value;

   email += email_address + email_subject + email_text;

   window.open(encodeURI(email),"_self");
}

function update_contact_image(image_file_name,direction)
{
   var about_image_file_name   = "./about/about.jpg";
   var gallery_index           = -1;
   var gallery_name            = image_file_name.split("/")[1];
   var image_caption_file_name = "";
   var image_number            = image_file_name.replace(/\D/g, "");
   var min_gallery_index       = 0;
   var max_gallery_index       = gallery_list.length -2;  // Use -2 instead of -1 to exclude "Sold" gallery.


   for (i = 0; i < gallery_list.length; i++)
   {
      if (gallery_name == gallery_list[i]["name"])
      {
         gallery_index = i;

         break;
      }
   }

   if (image_file_name == about_image_file_name)
   {
      if (direction == "right")
      {
         image_caption_file_name = "./" + gallery_list[min_gallery_index]["name"] + "/" + gallery_list[min_gallery_index]["name"] + "_" + gallery_list[min_gallery_index]["min_image_number"] + "_caption.txt";
      }
      else  // direction == "left"
      {
         image_caption_file_name = "./" + gallery_list[max_gallery_index]["name"] + "/" + gallery_list[max_gallery_index]["name"] + "_" + gallery_list[max_gallery_index]["max_image_number"] + "_caption.txt";
      }
   }
   else
   {
      if (direction == "right")
      {
         if (image_number < gallery_list[gallery_index]["max_image_number"])
         {
            image_caption_file_name = "./" + gallery_name + "/" + gallery_name + "_" + (parseInt(image_number,10)+1) + "_caption.txt";
         }
         else  // image number == gallery_list[gallery_index]["max_image_number"]
         {
            if (gallery_index == max_gallery_index)
            {
               image_caption_file_name = about_image_file_name.replace(".jpg",".txt");
            }
            else
            {
               image_caption_file_name = "./" + gallery_list[gallery_index+1]["name"] + "/" + gallery_list[gallery_index+1]["name"] + "_" + gallery_list[gallery_index+1]["min_image_number"] + "_caption.txt";
            }
         }
      }
      else  // direction == "left"
      {
         if (image_number > gallery_list[gallery_index]["min_image_number"])
         {
            image_caption_file_name = "./" + gallery_name + "/" + gallery_name + "_" + (parseInt(image_number,10)-1) + "_caption.txt";
         }
         else  // image number == gallery_list[gallery_index]["min_image_number"]
         {
            if (gallery_index == min_gallery_index)
            {
               image_caption_file_name = about_image_file_name.replace(".jpg",".txt");
            }
            else
            {
               image_caption_file_name = "./" + gallery_list[gallery_index-1]["name"] + "/" + gallery_list[gallery_index-1]["name"] + "_" + gallery_list[gallery_index-1]["max_image_number"] + "_caption.txt";
            }
         }
      }
   }

   display_contact_page(image_caption_file_name,true);
}

</script>


</body>

</html>

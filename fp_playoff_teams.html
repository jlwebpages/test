<!DOCTYPE html>

<html style="height: 100%; margin: 0px; padding: 0px">

<head>
   <title>NFL Football Pool</title>
   <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="fp.css" rel="stylesheet" type="text/css">
   <script language="JavaScript" src=fp_javascript_functions_general.js></script>
</head>

<body class="background_color" style="height: 100%; margin: 0px; padding: 0px">

<script language="JavaScript">

var number_of_columns = 4;
var mode              = "";
var URL_string        = window.location.search;;
var URL_parameters    = new URLSearchParams(URL_string);;
var year              = 0;


year = URL_parameters.get("year");
mode = URL_parameters.get("mode");

if (year <= 2001) number_of_columns = 3;

if ( (year == null || mode == null) || (isNaN(year) == true) || (year > top.fp_year) || (mode != "main" && mode != "playoffs" && mode != "archive") )
{
   alert("Error:  Invalid parameters passed to fp_playoff_teams.html");

   if (history.length > 1)
   {
      history.back();
   }
   else
   {
      window.close();
   }
}
else
{
   if (top.document.getElementById("fp_main_header") != null)
   {
      var fp_main_header_content = '';

      fp_main_header_content  = '      <table class="table" style="margin-left: -3px; width: 100.2%; height: 40px; border-spacing: 10px 0px">';
      fp_main_header_content += '         <tr>';
      if (mode == "playoffs")
      {
         fp_main_header_content += '            <td class="fp_button_cell">PLAYOFF TEAMS</td>';    
      }
      else
      {
         fp_main_header_content += '            <td class="fp_button_cell"><a class="white_link" href="fp_archive.html" target="fp_main">ARCHIVE</a></td>';
      }
      fp_main_header_content += '            <td class="fp_button_cell"><a class="white_link" href="fp.html" target="_top">HOME</a></td>';
      fp_main_header_content += '         </tr>';
      fp_main_header_content += '      </table>';

      top.document.getElementById("fp_main_header").innerHTML = fp_main_header_content; 
   }

   get_nfl_playoff_teams(year,mode);
}

</script>

<style>img {height: 65px; width: 65px}</style>

<script>

if (top.mobile == true)
{
   document.write('<table id="playoff_teams" style="border-spacing: 10px 5px; border: 0px; margin: 0px auto; padding-top: 10px; width: 100%; height: 0%; max-width: 800px">');
}
else
{
   document.write('<table id="playoff_teams" style="border-spacing: 10px 5px; border: 0px; margin: 0px auto; padding-top: 10px; width: 100%; height: 60%">');
}

</script>

   <tr>

      <td id="afc_playoff_teams" style="visibility: hidden">

         <table class="playoff_teams_table red_color">

            <tr>
               <script>document.write('<td colspan="'+number_of_columns+'" style="font-size: 16pt">'+year+' AFC Playoff Teams</td>');</script>
            </tr>

            <tr>
               <td id="AFC_1"></td>
               <td id="AFC_2"></td>
               <td id="AFC_3"></td>
               <script>if (year >= 2002) document.write('<td id="AFC_4"></td>');</script>
            </tr>

            <tr>
               <script>document.write('<td colspan="'+number_of_columns+'">');</script>  
                  <div style="display: flex; justify-content: space-evenly; width: 85%; margin: 0px auto">
                     <script>if (year <= 2001) document.write('<div id="AFC_4"></div>');</script>
                     <div id="AFC_5"></div>
                     <div id="AFC_6"></div>
                     <script>if (year >= 2020) document.write('<div id="AFC_7"></div>');</script>
                  </div>
               </td>
            </tr>

         </table>

      </td>

   <script>

   if (top.mobile == true)
   {
      document.write('');
      document.write('   </tr>');
      document.write('');
      document.write('   <tr>');
      document.write('');
   }

   </script>

      <td id="nfc_playoff_teams" style="visibility: hidden">

         <table class="playoff_teams_table dark_blue_color">

            <tr>
               <script>document.write('<td colspan="'+number_of_columns+'" style="font-size: 16pt">'+year+' NFC Playoff Teams</td>');</script>
            </tr>

            <tr>
               <td id="NFC_1"></td>
               <td id="NFC_2"></td>
               <td id="NFC_3"></td>
               <script>if (year >= 2002) document.write('<td id="NFC_4"></td>');</script>
            </tr>

            <tr>
               <script>document.write('<td colspan="'+number_of_columns+'">');</script>  
                  <div style="display: flex; justify-content: space-evenly; width: 85%; margin: 0px auto">
                     <script>if (year <= 2001) document.write('<div id="NFC_4"></div>');</script>
                     <div id="NFC_5"></div>
                     <div id="NFC_6"></div>
                     <script>if (year >= 2020) document.write('<div id="NFC_7"></div>');</script>
                  </div>
               </td>
            </tr>

         </table>

      </td>

   </tr>

</table>

</body>

</html>

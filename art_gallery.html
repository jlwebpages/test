<!DOCTYPE html>

<html>

<head>
   <title>Darlene Laguna</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <link href="styles.css" rel="stylesheet" type="text/css">
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
   <script language="JavaScript" src=scripts.js></script>
</head>

<body class="body" oncontextmenu="return false;">


<script>

function get_url_parameters()
{
   var gallery_index      = null;
   var html_file_name     = "";
   var html_path_segments = "";
   var URL_parameters     = new URLSearchParams(window.location.search);


   html_path_segments = window.location.pathname.split('/');
   html_file_name     = html_path_segments[html_path_segments.length - 1];

   gallery_index = URL_parameters.get("gallery_index");

   if ( (gallery_index == null) || (gallery_index == "") )
   {
      alert("Error:\n\nGallery Index not passed to " + html_file_name);

      if (history.length > 1)
      {
         history.back();
      }
      else
      {
         window.close();
      }

      return false;
   }

   if (validate_gallery_index(gallery_index) == false)
   {
      alert("Error:\n\nInvalid Gallery Index passed to " + html_file_name);

      if (history.length > 1)
      {
         history.back();
      }
      else
      {
         window.close();
      }

      return false;
   }

   return gallery_index;
}

</script>

<script>

   var gallery_index = "";


   gallery_index = get_url_parameters();

   write_header();

   document.title = "Darlene Laguna - " + gallery_list[gallery_index]["title"];

   document.getElementById(gallery_list[gallery_index]["name"]+"_link").className = "clicked_header_link";

</script>

<div id="art_gallery" class="art_gallery">

   <div id="one_column_1"   class="art_gallery_column"></div>

   <div id="two_column_1"   class="art_gallery_column"></div>

   <div id="two_column_2"   class="art_gallery_column"></div>

   <div id="three_column_1" class="art_gallery_column"></div>

   <div id="three_column_2" class="art_gallery_column"></div>

   <div id="three_column_3" class="art_gallery_column"></div>

</div>

<script>

   document.getElementById("art_gallery").insertAdjacentHTML("beforebegin","<div id='gallery_header' class='header_link' style='text-align: center; margin-bottom: 15px; display: none'>"+gallery_list[gallery_index]["title"]+"</div>");

   load_images_into_gallery(gallery_index);

   write_footer();

</script>


</body>

</html>

<!DOCTYPE html>

<html>

<head>
   <title>Darlene Laguna Art</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <link href="styles.css" rel="stylesheet" type="text/css">
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
   <script language="JavaScript" src=scripts.js></script>
</head>

<body class="body" style="background-color: black" onload="validate_received_image_name();">

 
 <!-- Load HTML from display_image_with_caption function. -->

<script>

   // Reset landing_container padding-top style if the user switches to portrait orientation from landscape orientation.

   mediaQuery_portrait = window.matchMedia("(orientation: portrait)");

   function respond_to_portrait_orientation(event)
   {
      if (event.matches)
      {
         location.href = self.location.href;
      }
   } 

   mediaQuery_portrait.addEventListener("change", respond_to_portrait_orientation);

   mediaQuery_landscape = window.matchMedia("(orientation: landscape)");

   function respond_to_landscape_orientation(event)
   {
      if (event.matches)
      {
         location.href = self.location.href;
      }
   } 

   mediaQuery_landscape.addEventListener("change", respond_to_landscape_orientation);

</script>


</body>

</html>
